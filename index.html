<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>零號病房</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    color:#e8edf5;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}

body{
    touch-action:none;
}

/* =========================
   遊戲主畫面
========================= */

#game{
    position:fixed;
    inset:0;
    background:#05070b;
    overflow:hidden;
}

canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   橫屏提示
========================= */

#rotateScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle at center,#17202d 0%,#05070b 65%);
    text-align:center;
}

.rotateIcon{
    width:90px;
    height:60px;
    border:3px solid #dce8ff;
    border-radius:10px;
    margin-bottom:22px;
    position:relative;
    animation:rotateHint 1.8s infinite ease-in-out;
}

.rotateIcon::after{
    content:"";
    position:absolute;
    width:22px;
    height:3px;
    background:#dce8ff;
    right:-22px;
    top:26px;
}

@keyframes rotateHint{
    0%,100%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(90deg);
    }
}

.rotateText{
    font-size:18px;
    letter-spacing:3px;
}

.rotateSub{
    margin-top:8px;
    color:#7e8a9d;
    font-size:13px;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:20;
}

#chapter{
    position:absolute;
    left:22px;
    top:18px;
    font-size:15px;
    letter-spacing:2px;
    color:#dce5f2;
    text-shadow:0 2px 8px #000;
}

#objectiveBox{
    position:absolute;
    left:22px;
    top:48px;
    max-width:420px;
    padding:9px 13px;
    border-left:2px solid #7388a8;
    background:rgba(5,8,14,.68);
    backdrop-filter:blur(5px);
}

.objectiveTitle{
    font-size:10px;
    color:#77869d;
    letter-spacing:2px;
}

#objective{
    margin-top:3px;
    font-size:13px;
    color:#dce4ef;
}

#batteryBox{
    position:absolute;
    right:20px;
    top:18px;
    width:135px;
}

.batteryTitle{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#9ca8b9;
    margin-bottom:5px;
}

#batteryBar{
    width:100%;
    height:5px;
    background:#1b222c;
    border-radius:5px;
    overflow:hidden;
}

#batteryFill{
    height:100%;
    width:82%;
    background:#d8e6ff;
    transition:.2s;
}

#saveText{
    position:absolute;
    right:20px;
    top:58px;
    font-size:11px;
    color:#6d7787;
}

/* =========================
   互動提示
========================= */

#interactionPrompt{
    position:absolute;
    left:50%;
    bottom:112px;
    transform:translateX(-50%);
    padding:9px 16px;
    border:1px solid rgba(180,200,230,.35);
    background:rgba(5,8,13,.78);
    color:#e6edf7;
    font-size:13px;
    letter-spacing:1px;
    opacity:0;
    transition:.15s;
    white-space:nowrap;
}

#interactionPrompt.show{
    opacity:1;
}

/* =========================
   控制
========================= */

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:105px;
    height:105px;
    border-radius:50%;
    border:1px solid rgba(190,210,240,.28);
    background:rgba(15,20,29,.45);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:46px;
    height:46px;
    left:29px;
    top:29px;
    border-radius:50%;
    background:rgba(190,210,240,.22);
    border:1px solid rgba(220,235,255,.32);
}

.controlButton{
    position:absolute;
    z-index:70;
    pointer-events:auto;
    width:62px;
    height:62px;
    border-radius:50%;
    border:1px solid rgba(210,225,245,.35);
    background:rgba(10,15,23,.68);
    color:#dce6f4;
    font-size:12px;
    letter-spacing:1px;
}

#interactBtn{
    right:25px;
    bottom:25px;
}

#flashBtn{
    right:98px;
    bottom:95px;
}

#bagBtn{
    right:25px;
    bottom:98px;
}

/* =========================
   成就
========================= */
#achievementBtn{
    position:absolute;
    right:25px;
    bottom:171px;
    width:62px;
    height:44px;
    border-radius:22px;
    border:1px solid rgba(210,225,245,.35);
    background:rgba(10,15,23,.68);
    color:#dce6f4;
    font-size:11px;
    letter-spacing:1px;
    pointer-events:auto;
}
#achievementPanel{
    position:absolute;
    right:170px;
    top:92px;
    width:250px;
    max-height:210px;
    padding:12px;
    display:none;
    background:rgba(7,10,16,.94);
    border:1px solid rgba(180,200,230,.25);
    pointer-events:auto;
    overflow:auto;
    z-index:60;
    border-radius:8px;
    box-shadow:0 12px 35px rgba(0,0,0,.55);
}
#achievementPanel.show{display:block;}
.achievementTitle{
    font-size:13px;
    letter-spacing:2px;
    color:#b8c5d8;
    margin-bottom:10px;
}
.achievement{
    padding:9px;
    margin-bottom:7px;
    border:1px solid rgba(180,200,230,.14);
    background:rgba(255,255,255,.025);
}
.achievement.locked{opacity:.42;}
.achievement b{
    display:block;
    font-size:13px;
    font-weight:500;
}
.achievement small{
    display:block;
    margin-top:3px;
    color:#78869a;
    font-size:11px;
}
.achievement.unlocked b{color:#e1ebf7;}
.achievement.unlocked small{color:#9eafc4;}

/* =========================
   背包
========================= */

#inventory{
    position:absolute;
    right:170px;
    top:92px;
    width:250px;
    max-height:210px;
    padding:12px;
    display:none;
    background:rgba(7,10,16,.94);
    border:1px solid rgba(180,200,230,.25);
    pointer-events:auto;
    overflow:auto;
    z-index:60;
    border-radius:8px;
    box-shadow:0 12px 35px rgba(0,0,0,.55);
}

#inventory.show{
    display:block;
}

.inventoryTitle{
    font-size:13px;
    letter-spacing:2px;
    color:#b8c5d8;
    margin-bottom:10px;
}

.item{
    padding:9px;
    margin-bottom:7px;
    border:1px solid rgba(180,200,230,.14);
    background:rgba(255,255,255,.025);
}

.item b{
    display:block;
    font-size:13px;
    font-weight:500;
}

.item small{
    display:block;
    margin-top:3px;
    color:#78869a;
    font-size:11px;
}

/* =========================
   對話框
========================= */

#dialogue{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:min(720px,88%);
    min-height:105px;
    padding:17px 20px;
    background:rgba(5,8,14,.94);
    border:1px solid rgba(180,200,230,.28);
    box-shadow:0 8px 35px rgba(0,0,0,.55);
    display:none;
    pointer-events:auto;
}

#dialogue.show{
    display:block;
}

#dialogueSpeaker{
    color:#aebdd1;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:9px;
}

#dialogueText{
    white-space:pre-line;
    line-height:1.8;
    font-size:14px;
    color:#edf2f8;
}

.dialogueHint{
    position:absolute;
    right:15px;
    bottom:8px;
    color:#647186;
    font-size:10px;
}

/* =========================
   謎題
========================= */

#puzzleModal{
    position:absolute;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.68);
    pointer-events:auto;
}

#puzzleModal.show{
    display:flex;
}

.puzzleBox{
    width:min(390px,85%);
    padding:24px;
    background:#0b1018;
    border:1px solid rgba(190,210,240,.3);
    box-shadow:0 20px 60px #000;
}

#puzzleTitle{
    font-size:18px;
    letter-spacing:2px;
    margin-bottom:13px;
}

#puzzleDescription{
    white-space:pre-line;
    line-height:1.7;
    font-size:13px;
    color:#9ba9bb;
    margin-bottom:17px;
}

#puzzleInput{
    width:100%;
    height:45px;
    padding:0 13px;
    background:#060a10;
    border:1px solid #303c4d;
    color:#edf4ff;
    outline:none;
    text-align:center;
    font-size:20px;
    letter-spacing:7px;
}

.puzzleButtons{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.puzzleButtons button{
    flex:1;
    height:42px;
    border:1px solid #344154;
    background:#121a25;
    color:#dce7f5;
}

#puzzleMessage{
    min-height:20px;
    margin-top:10px;
    text-align:center;
    color:#b9c7d8;
    font-size:12px;
}

/* =========================
   開始畫面
========================= */

#startScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle at center,
            rgba(30,43,61,.5),
            rgba(3,5,9,.98) 68%);
    pointer-events:auto;
}

.gameTitle{
    font-size:42px;
    letter-spacing:10px;
    font-weight:300;
    color:#e6edf7;
    text-shadow:0 0 30px rgba(180,210,255,.18);
}

.gameSubtitle{
    margin-top:12px;
    color:#6e7b8e;
    letter-spacing:4px;
    font-size:12px;
}

#startBtn{
    margin-top:42px;
    width:180px;
    height:48px;
    border:1px solid rgba(210,225,245,.35);
    background:rgba(16,23,33,.78);
    color:#e3ebf6;
    letter-spacing:4px;
}

.startHint{
    margin-top:18px;
    color:#4f5c6d;
    font-size:11px;
}

/* =========================
   電影感結局
========================= */
#endingScreen{
    position:absolute;
    inset:0;
    z-index:800;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:8vh 12vw;
    background:#000;
    color:#e8edf5;
    text-align:center;
    opacity:0;
    transition:opacity 1.2s ease;
    pointer-events:none;
}
#endingScreen.show{opacity:1;pointer-events:auto;}
.endingTitle{font-size:12px;letter-spacing:7px;color:#78869a;margin-bottom:38px;}
#endingText{max-width:900px;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:2.1;letter-spacing:2px;color:#dce3ed;text-shadow:0 0 20px rgba(190,215,245,.08);transition:opacity .8s ease;}
#endingNext,#endingHome{width:170px;height:44px;margin-top:28px;border:1px solid rgba(210,225,245,.28);background:rgba(14,19,27,.9);color:#dce5f0;letter-spacing:3px;}
#endingHome{display:none;}

/* =========================
   黑幕
========================= */

#fade{
    position:absolute;
    inset:0;
    z-index:400;
    background:#000;
    pointer-events:none;
    opacity:0;
    transition:opacity .8s;
}

#fade.show{
    opacity:1;
}

/* =========================
   小螢幕
========================= */

@media (orientation:portrait){

    #rotateScreen{
        display:flex;
    }

    #game{
        display:none;
    }

}

</style>
</head>

<body>

<div id="rotateScreen">
    <div class="rotateIcon"></div>
    <div class="rotateText">請將手機橫向</div>
    <div class="rotateSub">《零號病房》需要橫屏遊玩</div>
</div>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

    <div id="chapter">第一章｜一樓大廳</div>

    <div id="objectiveBox">
        <div class="objectiveTitle">CURRENT OBJECTIVE</div>
        <div id="objective">調查這座醫院</div>
    </div>

    <div id="batteryBox">
        <div class="batteryTitle">
            <span>FLASHLIGHT</span>
            <span id="batteryText">82%</span>
        </div>
        <div id="batteryBar">
            <div id="batteryFill"></div>
        </div>
    </div>

    <div id="saveText"></div>

    <div id="interactionPrompt">
        點擊互動
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="interactBtn" class="controlButton">互動</button>
    <button id="flashBtn" class="controlButton">燈光</button>
    <button id="bagBtn" class="controlButton">背包</button>
    <button id="achievementBtn">成就</button>

    <div id="achievementPanel">
        <div class="achievementTitle">ACHIEVEMENTS</div>
        <div id="achievementList"></div>
    </div>

    <div id="inventory">
        <div class="inventoryTitle">物品</div>
        <div id="inventoryList"></div>
    </div>

    <div id="dialogue">

        <div id="dialogueSpeaker"></div>
        <div id="dialogueText"></div>

        <div class="dialogueHint">
            點擊繼續
        </div>

    </div>

</div>


<div id="puzzleModal">

    <div class="puzzleBox">

        <div id="puzzleTitle"></div>

        <div id="puzzleDescription"></div>

        <input
            id="puzzleInput"
            inputmode="numeric"
            autocomplete="off"
        >

        <div class="puzzleButtons">
            <button id="puzzleSubmit">確認</button>
            <button id="puzzleClose">取消</button>
        </div>

        <div id="puzzleMessage"></div>

    </div>

</div>


<div id="startScreen">

    <div class="gameTitle">零號病房</div>

    <div class="gameSubtitle">
        ROOM ZERO
    </div>

    <button id="startBtn">
        開始遊戲
    </button>

    <div class="startHint">
        建議戴上耳機遊玩
    </div>

</div>


<div id="endingScreen">
    <div class="endingTitle">ROOM ZERO · FINAL RECORD</div>
    <div id="endingText"></div>
    <button id="endingNext">繼續</button>
    <button id="endingHome">返回首頁</button>
</div>

<div id="fade"></div>

</div>


<script>

/* ============================================================
   CANVAS
============================================================ */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;

const GAME_WIDTH=1280;
const GAME_HEIGHT=720;

function resizeCanvas(){

    /*
       保持遊戲使用固定的 1280 × 720 邏輯畫布。
       CSS 會負責把整個畫面縮放到手機橫屏尺寸，
       因此不會再因手機解析度不同而只顯示半邊地圖。
    */
    W=GAME_WIDTH;
    H=GAME_HEIGHT;

    canvas.width=GAME_WIDTH;
    canvas.height=GAME_HEIGHT;

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();


/* ============================================================
   遊戲狀態
============================================================ */

const game={

    started:false,

    scene:"lobby",

    flashlight:true,

    battery:82,

    dialogue:false,

    puzzle:false,

    paused:false,

    ending:false,

    bagOpen:false,

    inventory:[],

    achievements:[],

    generator:false,

    basementUnlocked:false,

    thirdFloor:false,

    ghostEvent:false,

    wheelchairMotionUntil:0,

    mirrorEvent:false,
    mirrorReflectionStage:0,

    zeroMirrorSolved:false,

    zeroCabinet:false,

    zeroChairChecked:false,

    zeroDoorUnlocked:false,

    archivePower:false,

    archivePuzzleSolved:false,

    archiveDoorUnlocked:false,

    finalTriggered:false,

    firstCardFound:false,
    firstRecordFound:false,
    firstMaintenanceFound:false,
    basementBoxChecked:false,
    thirdNurseChecked:false,
    thirdRoom1Checked:false,
    thirdRoom2Checked:false,
    thirdMirrorChecked:false,
    zeroRecorderChecked:false,
    zeroMirrorSlideStart:0,

    archiveTerminalChecked:false,
    archiveFilesChecked:false,
    archiveMonitorChecked:false,

    objective:"調查這座醫院"

};


/* ============================================================
   玩家
============================================================ */

const player={

    x:620,
    y:430,

    speed:2.5,

    radius:17,

    dirX:1,
    dirY:0,

    lastDirX:1,
    lastDirY:0,

    moving:false

};


/* ============================================================
   場景
============================================================ */

const scenes={

    lobby:{
        chapter:"第一章｜一樓大廳",
        objective:"調查這座醫院"
    },

    basement:{
        chapter:"第二章｜地下室",
        objective:"啟動發電機，恢復三樓電力"
    },

    third:{
        chapter:"第三章｜三樓病房",
        objective:"調查三樓病房區的異常"
    },

    zero:{
        chapter:"第四章｜零號病房",
        objective:"調查 ROOM ZERO，找出隱藏的病歷"
    },

    basement2:{
        chapter:"第五章｜記憶研究部",
        objective:"找到記憶研究部的完整檔案"
    }

};


/* ============================================================
   物品
============================================================ */

const itemData={

    hospitalCard:{
        name:"舊式員工卡",
        description:"卡片上的名字是林予安。"
    },

    basementKey:{
        name:"病歷室鑰匙",
        description:"一把老舊的鑰匙。"
    },

    medicalRecord:{
        name:"病歷：林予安",
        description:"最後紀錄日期：01月27日。"
    },

    maintenanceNote:{
        name:"維修紀錄",
        description:"發電機啟動順序：A → C → B → D。"
    },

    zeroKey:{
        name:"零號鑰匙",
        description:"用來打開隱藏樓梯的鑰匙。"
    },

    archiveKey:{
        name:"檔案室鑰匙",
        description:"記憶研究部的備用鑰匙。"
    }

};


function hasItem(id){

    return game.inventory.includes(id);

}


function addItem(id){

    if(!hasItem(id)){

        game.inventory.push(id);

        updateInventory();
updateAchievements();

    }

}


function updateInventory(){

    const list=document.getElementById("inventoryList");

    list.innerHTML="";

    if(game.inventory.length===0){

        list.innerHTML=
            `<div class="item">
                <small>目前沒有物品</small>
            </div>`;

        return;

    }

    game.inventory.forEach(id=>{

        const data=itemData[id];

        if(!data) return;

        const div=document.createElement("div");

        div.className="item";

        div.innerHTML=`
            <b>${data.name}</b>
            <small>${data.description}</small>
        `;

        list.appendChild(div);

    });

}


/* ============================================================
   成就系統
============================================================ */
const achievementData={
    firstClue:{name:"初來乍到",description:"第一次調查醫院裡的可疑物件。"},
    familiarName:{name:"似曾相識",description:"第一次看見「林予安」這個名字。"},
    wheelchairShock:{name:"誰推的？",description:"第一次調查那張突然自己動了一下的輪椅。"},
    powerRestored:{name:"重新點亮",description:"重新啟動地下室發電機。"},
    mirrorTruth:{name:"鏡中異常",description:"發現三樓鏡子的異常。"},
    roomZero:{name:"ROOM ZERO",description:"找到零號病房。"},
    fourthRecord:{name:"第四次記錄",description:"找到零號病房的實驗紀錄。"},
    hiddenCabinet:{name:"鏡後之物",description:"打開鏡子移開後露出的病歷櫃。"},
    researchDept:{name:"記憶研究部",description:"進入隱藏的記憶研究部。"},
    finalArchive:{name:"最後的檔案",description:"找到記憶研究部的完整檔案。"}
};

function unlockAchievement(id){
    if(game.achievements.includes(id)) return;
    game.achievements.push(id);
    updateAchievements();
    const a=achievementData[id];
    if(a){
        showDialogue("成就解鎖",`「${a.name}」\n${a.description}`);
    }
    saveGame();
}

function updateAchievements(){
    const list=document.getElementById("achievementList");
    if(!list) return;
    list.innerHTML="";
    Object.entries(achievementData).forEach(([id,a])=>{
        const unlocked=game.achievements.includes(id);
        const div=document.createElement("div");
        div.className=`achievement ${unlocked?"unlocked":"locked"}`;
        div.innerHTML=`<b>${unlocked?"◆":"◇"} ${a.name}</b><small>${unlocked?a.description:"尚未解鎖"}</small>`;
        list.appendChild(div);
    });
}

function toggleAchievements(){
    const panel=document.getElementById("achievementPanel");
    if(!panel) return;
    game.bagOpen=false;
    document.getElementById("inventory").classList.remove("show");
    panel.classList.toggle("show");
    if(panel.classList.contains("show")) updateAchievements();
}

/* ============================================================
   搖桿
============================================================ */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickActive=false;

let joyX=0;
let joyY=0;

function updateJoystick(clientX,clientY){

    const rect=joystick.getBoundingClientRect();

    let dx=clientX-(rect.left+rect.width/2);
    let dy=clientY-(rect.top+rect.height/2);

    const distance=Math.sqrt(dx*dx+dy*dy);

    const max=39;

    if(distance>max){

        dx=dx/distance*max;
        dy=dy/distance*max;

    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;

}


function resetJoystick(){

    joystickActive=false;

    joyX=0;
    joyY=0;

    stick.style.transform="translate(0,0)";

}


joystick.addEventListener("pointerdown",e=>{

    joystickActive=true;

    joystick.setPointerCapture(e.pointerId);

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointermove",e=>{

    if(!joystickActive) return;

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

let dialogueQueue=[];
let dialogueIndex=0;

function showDialogue(speaker,text){

    dialogueQueue=[
        {
            speaker,
            text
        }
    ];

    dialogueIndex=0;

    game.dialogue=true;

    renderDialogue();

}


function showDialogues(list){

    dialogueQueue=list;

    dialogueIndex=0;

    game.dialogue=true;

    renderDialogue();

}


function renderDialogue(){

    const box=document.getElementById("dialogue");

    if(dialogueIndex>=dialogueQueue.length){

        closeDialogue();

        return;

    }

    const data=dialogueQueue[dialogueIndex];

    /* 第三章鏡子：倒影依照劇情逐步出現。
       前兩句沒有倒影，直到玩家抬起手後，倒影才出現。 */
    if(game.scene==="third" && game.thirdMirrorChecked){
        if(data.text==="你站在鏡子前。" || data.text==="鏡子裡的人也站在原地。") {
            game.mirrorReflectionStage=0;
        }else if(data.text==="你抬起手。") {
            game.mirrorReflectionStage=1;
        }else if(data.text.includes("慢了半拍")) {
            game.mirrorReflectionStage=2;
        }
    }

    document.getElementById("dialogueSpeaker")
        .textContent=data.speaker;

    document.getElementById("dialogueText")
        .textContent=data.text;

    box.classList.add("show");

}


function closeDialogue(){

    dialogueQueue=[];
    dialogueIndex=0;

    game.dialogue=false;

    document.getElementById("dialogue")
        .classList.remove("show");

}


document.getElementById("dialogue")
.addEventListener("pointerdown",()=>{

    if(!game.dialogue) return;

    dialogueIndex++;

    renderDialogue();

});

/* ============================================================
   玩家移動
============================================================ */

function updatePlayer(){

    if(
        !game.started ||
        game.dialogue ||
        game.puzzle ||
        game.bagOpen ||
        game.ending
    ){

        player.moving=false;

        return;

    }

    let dx=joyX;
    let dy=joyY;

    if(keys["w"] || keys["arrowup"]) dy=-1;
    if(keys["s"] || keys["arrowdown"]) dy=1;
    if(keys["a"] || keys["arrowleft"]) dx=-1;
    if(keys["d"] || keys["arrowright"]) dx=1;

    const length=Math.sqrt(dx*dx+dy*dy);

    if(length>0){

        dx/=length;
        dy/=length;

        player.moving=true;

        player.dirX=dx;
        player.dirY=dy;

        player.lastDirX=dx;
        player.lastDirY=dy;

        let nx=player.x+dx*player.speed;
        let ny=player.y+dy*player.speed;

        if(!collides(nx,player.y)){

            player.x=nx;

        }

        if(!collides(player.x,ny)){

            player.y=ny;

        }

    }else{

        player.moving=false;

    }

}


function collides(x,y){

    const ws=walls();

    for(const wall of ws){

        const nearestX=
            Math.max(wall.x,
            Math.min(x,wall.x+wall.w));

        const nearestY=
            Math.max(wall.y,
            Math.min(y,wall.y+wall.h));

        const dx=x-nearestX;
        const dy=y-nearestY;

        if(
            dx*dx+
            dy*dy<
            player.radius*player.radius
        ){

            return true;

        }

    }

    return false;

}


/* ============================================================
   最近互動物件
============================================================ */

let nearestObject=null;

function nearestObjectFind(){

    const list=objects();

    let nearest=null;
    let distance=Infinity;

    for(const obj of list){

        const objectX=(typeof obj.hitX==="number") ? obj.hitX : obj.x;
        const dx=objectX-player.x;
        const dy=obj.y-player.y;

        const d=Math.sqrt(dx*dx+dy*dy);

        if(d<obj.r+55 && d<distance){

            nearest=obj;
            distance=d;

        }

    }

    return nearest;

}


function updateInteract(){

    nearestObject=nearestObjectFind();

    const prompt=document.getElementById("interactionPrompt");

    if(nearestObject && !game.dialogue && !game.puzzle){

        prompt.textContent=
            `互動：${objectName(nearestObject.id)}`;

        prompt.classList.add("show");

    }else{

        prompt.classList.remove("show");

    }

}

============================================================ */

function interact(){

    if(!game.started) return;

    if(game.dialogue){

        dialogueIndex++;

        renderDialogue();

        return;

    }

    if(game.puzzle) return;

    const obj=nearestObjectFind();

    if(!obj) return;

    switch(obj.id){

        case"desk":
            interactDesk();
            break;

        case"record":
            interactRecord();
            break;

        case"staff":
            interactStaff();
            break;

        case"basementDoor":
            interactBasementDoor();
            break;

        case"wheelchair":
            interactWheelchair();
            break;

        case"generator":
            interactGenerator();
            break;

        case"note":
            interactNote();
            break;

        case"box":
            interactBox();
            break;

        case"stairs":
            interactStairs();
            break;

        case"nurse":
            interactNurse();
            break;

        case"room1":
        case"room2":
            interactRoom(obj);
            break;

        case"mirror":
            interactMirror();
            break;

        case"zero":
            interactZero();
            break;

        case"recorder":
            interactRecorder();
            break;

        case"zeroMirror":
            interactZeroMirror();
            break;

        case"cabinet":
            interactCabinet();
            break;

        case"chair":
            interactChair();
            break;

        case"hiddenDoor":
            interactHiddenDoor();
            break;

        case"archiveTerminal":
            interactArchiveTerminal();
            break;

        case"archiveFiles":
            interactArchiveFiles();
            break;

        case"powerPanel":
            interactPowerPanel();
            break;

        case"archiveDoor":
            interactArchiveDoor();
            break;

        case"monitor":
            interactMonitor();
            break;

        case"returnDoor":
            interactReturnDoor();
            break;

    }

}

/* ============================================================
   謎題系統
============================================================ */

let currentPuzzleAnswer="";
let currentPuzzleSuccess=null;


function openPuzzle(
    title,
    description,
    answer,
    successCallback=null
){

    closeBag();

    game.puzzle=true;

    currentPuzzleAnswer=answer;
    currentPuzzleSuccess=
        successCallback || interactGeneratorSuccess;

    document.getElementById("puzzleTitle")
        .textContent=title;

    document.getElementById("puzzleDescription")
        .textContent=description;

    document.getElementById("puzzleInput")
        .value="";

    document.getElementById("puzzleMessage")
        .textContent="";

    document.getElementById("puzzleModal")
        .classList.add("show");

    setTimeout(()=>{

        document.getElementById("puzzleInput").focus();

    },100);

}


function submitPuzzle(){

    const input=
        document.getElementById("puzzleInput")
        .value
        .trim();

    if(input===currentPuzzleAnswer){

        document.getElementById("puzzleMessage")
            .textContent="正確。";

        setTimeout(()=>{

            const successCallback=currentPuzzleSuccess;

            closePuzzle();

            if(successCallback){

                successCallback();

            }

        },400);

    }else{

        document.getElementById("puzzleMessage")
            .textContent="答案不正確。再看看線索。";

    }

}


function closePuzzle(){

    game.puzzle=false;

    document.getElementById("puzzleModal")
        .classList.remove("show");

    currentPuzzleAnswer="";
    currentPuzzleSuccess=null;

}


document.getElementById("puzzleSubmit")
    .addEventListener("pointerdown",submitPuzzle);

document.getElementById("puzzleClose")
    .addEventListener("pointerdown",closePuzzle);

document.getElementById("puzzleInput")
    .addEventListener("keydown",e=>{

        if(e.key==="Enter"){

            submitPuzzle();

        }

    });

        firstCardFound:game.firstCardFound,
        firstRecordFound:game.firstRecordFound,
        firstMaintenanceFound:game.firstMaintenanceFound,
        basementBoxChecked:game.basementBoxChecked,

        zeroRecorderChecked:game.zeroRecorderChecked,

        archiveTerminalChecked:game.archiveTerminalChecked,
        archiveFilesChecked:game.archiveFilesChecked,
        archiveMonitorChecked:game.archiveMonitorChecked,

        objective:game.objective

    };

    localStorage.setItem(
        "room_zero_save",
        JSON.stringify(data)
    );

    showSave("已儲存");

}


function loadGame(){

    const raw=
        localStorage.getItem("room_zero_save");

    if(!raw) return;

    try{

        const data=JSON.parse(raw);

        game.scene=data.scene || "lobby";

        game.inventory=
            Array.isArray(data.inventory)
            ? data.inventory
            : [];

        game.achievements=
            Array.isArray(data.achievements)
            ? data.achievements
            : [];

        game.battery=
            typeof data.battery==="number"
            ? data.battery
            : 82;

        game.generator=!!data.generator;

        game.basementUnlocked=
            !!data.basementUnlocked;

        game.ghostEvent=
            !!data.ghostEvent;

        game.zeroMirrorSolved=
            !!data.zeroMirrorSolved;

        game.zeroCabinet=
            !!data.zeroCabinet;

        game.zeroChairChecked=
            !!data.zeroChairChecked;

        game.zeroDoorUnlocked=
            !!data.zeroDoorUnlocked;

        game.archivePower=
            !!data.archivePower;

        game.archivePuzzleSolved=
            !!data.archivePuzzleSolved;

        game.archiveDoorUnlocked=
            !!data.archiveDoorUnlocked;

        game.finalTriggered=
            !!data.finalTriggered;

        game.firstCardFound=!!data.firstCardFound;
        game.firstRecordFound=!!data.firstRecordFound;
        game.firstMaintenanceFound=!!data.firstMaintenanceFound;
        game.basementBoxChecked=!!data.basementBoxChecked;
        game.thirdNurseChecked=!!data.thirdNurseChecked;
        game.thirdRoom1Checked=!!data.thirdRoom1Checked;
        game.thirdRoom2Checked=!!data.thirdRoom2Checked;
        game.thirdMirrorChecked=!!data.thirdMirrorChecked;
        game.zeroRecorderChecked=!!data.zeroRecorderChecked;
        game.zeroMirrorSlideStart=data.zeroMirrorSlideStart || 0;
        game.archiveTerminalChecked=!!data.archiveTerminalChecked;
        game.archiveFilesChecked=!!data.archiveFilesChecked;
        game.archiveMonitorChecked=!!data.archiveMonitorChecked;

        if(data.objective){

            game.objective=data.objective;

        }

        setPlayerPosition();

    }catch(e){

        console.warn("存檔讀取失敗",e);

    }

}

    const home=document.getElementById("endingHome");

    const story=[
        "你醒來的時候，什麼都不記得。沒有名字，沒有過去，只有一座停電的醫院，以及腦海裡唯一清楚的念頭——離開這裡。",
        "你一路尋找出口，也一路拾回那些不屬於陌生人的痕跡。病歷、照片、錄音，還有一次又一次寫著「RETURN」的紀錄，都在告訴你：你不是第一次來到這裡。",
        "直到三樓的電腦亮起，那句「歡迎回來」第一次讓你停下腳步。你開始懷疑，這座醫院真正等待的人，或許就是你。",
        "零號病房裡，鏡子與日期留下了第一個缺口。當隱藏的病歷櫃被打開，你終於看見那個一直被刻意藏起來的名字。",
        "林予安。",
        "那一刻，你才知道自己是誰。可真正可怕的並不是名字，而是檔案裡記載的真相——你曾經接受過記憶研究，而那些被刪除的記憶，並不是意外消失。",
        "一次、兩次、三次……直到第四次醒來。每一次實驗，都試圖讓你忘記同一件事；每一次失敗，卻又讓你離真相更近。",
        "最後的紀錄告訴你：最初要求刪除記憶的人，也是你自己。不是因為你忘了這座醫院，而是因為你曾經知道真相，卻選擇讓自己忘記。",
        "你終於明白，從你睜開眼睛的那一刻開始，你一直都在逃。逃離醫院，逃離那些被刪掉的記憶，也逃離曾經的自己。",
        "而現在，你終於走到了門前。門牌上的「RETURN」不再代表回去，而是提醒你——這一次，你可以選擇不再回頭。",
        "門在身後闔上。清晨的光落在你臉上。你仍然不知道未來會去哪裡，但至少這一次，你記得自己的名字。",
        "林予安。"
    ];

    let index=0;
    let busy=false;

    fade.classList.add("show");

    setTimeout(()=>{
        fade.classList.remove("show");
        ending.style.display="flex";
        requestAnimationFrame(()=>ending.classList.add("show"));

        function showStory(){
            if(busy) return;
            if(index>=story.length){
                next.style.display="none";
                home.style.display="block";
                text.textContent="故事結束";
                return;
            }
            busy=true;
            text.style.opacity="0";
            setTimeout(()=>{
                text.textContent=story[index];
                text.style.opacity="1";
                index++;
                setTimeout(()=>busy=false,700);
            },450);
        }

        next.addEventListener("pointerdown",showStory);
        home.addEventListener("pointerdown",()=>{
            localStorage.removeItem("room_zero_save");
            location.reload();
        });
        showStory();
    },900);

}

/* ============================================================
   背景繪製
============================================================ */

function drawBackground(){

    ctx.clearRect(0,0,W,H);

    ctx.fillStyle="#080b10";

    ctx.fillRect(0,0,W,H);

    const floorGrad=
        ctx.createLinearGradient(
            0,0,0,H
        );

    floorGrad.addColorStop(0,"#121821");
    floorGrad.addColorStop(1,"#070a0f");

    ctx.fillStyle=floorGrad;

    ctx.fillRect(0,0,W,H);

    /* 地板格線 */

    ctx.strokeStyle="rgba(130,150,180,.055)";
    ctx.lineWidth=1;

    const grid=50;

    for(let x=0;x<W;x+=grid){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();

    }

    for(let y=0;y<H;y+=grid){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();

    }

    /* 牆 */

    const ws=walls();

    for(const wall of ws){

        ctx.fillStyle="#202935";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle="#364251";

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }

    drawObjects();
    drawPlayer();
    drawLighting();

}


/* ============================================================
   物件繪製
============================================================ */

function drawObjects(){

    const list=objects();

    for(const obj of list){

        ctx.save();

        ctx.translate(obj.x,obj.y);

        if(
            obj.id==="desk" ||
            obj.id==="record" ||
            obj.id==="staff"
        ){

            ctx.fillStyle="#28323e";
            ctx.fillRect(-35,-22,70,44);

            ctx.strokeStyle="#556477";
            ctx.strokeRect(-35,-22,70,44);

        }

        else if(obj.id==="basementDoor"){

            ctx.fillStyle="#202a35";
            ctx.fillRect(-38,-58,76,116);

            ctx.strokeStyle="#647286";
            ctx.strokeRect(-38,-58,76,116);

            ctx.fillStyle="#111820";
            ctx.fillRect(12,-3,5,6);

        }

        else if(obj.id==="wheelchair"){

            const movingGhost=Date.now()<game.wheelchairMotionUntil;
            const sway=movingGhost ? Math.sin(Date.now()/90)*7 : 0;
            const roll=movingGhost ? Math.sin(Date.now()/55)*0.12 : 0;

            ctx.translate(sway,0);
            ctx.rotate(roll);

            ctx.strokeStyle="#8290a2";
            ctx.lineWidth=4;

            ctx.beginPath();
            ctx.arc(-13,15,15,0,Math.PI*2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(16,15,10,0,Math.PI*2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-13,0);
            ctx.lineTo(10,-20);
            ctx.lineTo(28,-4);
            ctx.stroke();

        }

        else if(obj.id==="generator"){

            ctx.fillStyle="#303b47";
            ctx.fillRect(-42,-35,84,70);

            ctx.strokeStyle="#7b8a9e";
            ctx.strokeRect(-42,-35,84,70);

            ctx.fillStyle=
                game.generator
                ? "#a9d8a7"
                : "#bd6d6d";

            ctx.beginPath();
            ctx.arc(0,0,9,0,Math.PI*2);
            ctx.fill();

        }

        else if(obj.id==="note"){

            ctx.fillStyle="#c7c0a9";
            ctx.fillRect(-25,-18,50,36);

            ctx.fillStyle="#20242a";
            ctx.font="10px sans-serif";
            ctx.fillText("A C B D",-18,4);

        }

        else if(obj.id==="box"){

            ctx.fillStyle="#5b4637";
            ctx.fillRect(-34,-30,68,60);

            ctx.strokeStyle="#8a6951";
            ctx.strokeRect(-34,-30,68,60);

        }

        else if(obj.id==="stairs"){

            ctx.strokeStyle="#7e8b9c";
            ctx.lineWidth=4;

            for(let i=-35;i<=35;i+=14){

                ctx.beginPath();
                ctx.moveTo(i,-35);
                ctx.lineTo(i+25,35);
                ctx.stroke();

            }

        }

        else if(obj.id==="nurse"){

            ctx.fillStyle="#bfc9d5";
            ctx.fillRect(-30,-18,60,36);

            ctx.fillStyle="#607087";
            ctx.fillRect(-22,-28,44,10);

        }

        else if(
            obj.id==="room1" ||
            obj.id==="room2"
        ){

            ctx.fillStyle="#252e39";
            ctx.fillRect(-35,-25,70,50);

            ctx.strokeStyle="#68788c";
            ctx.strokeRect(-35,-25,70,50);

        }

        else if(
            obj.id==="mirror" ||
            obj.id==="zeroMirror"
        ){

            let slide=0;

            if(obj.id==="zeroMirror" && game.zeroMirrorSlideStart){
                slide=Math.min(125,((Date.now()-game.zeroMirrorSlideStart)/700)*125);
            }

            ctx.translate(-slide,0);

            ctx.fillStyle="#172331";
            ctx.fillRect(-45,-58,90,116);

            ctx.strokeStyle="#7c91a9";
            ctx.strokeRect(-45,-58,90,116);

            ctx.fillStyle="rgba(120,170,220,.18)";
            ctx.fillRect(-38,-50,76,100);

            /* 第三章：鏡子正常出現玩家的倒影 */
            if(obj.id==="mirror" && game.mirrorReflectionStage>0){

                ctx.save();

                ctx.globalAlpha=0.58;
                ctx.fillStyle="#9aaabd";

                /* 頭 */
                ctx.beginPath();
                ctx.arc(0,-22,10,0,Math.PI*2);
                ctx.fill();

                /* 身體 */
                ctx.fillRect(-12,-10,24,43);

                /* 手臂 */
                ctx.strokeStyle="#9aaabd";
                ctx.lineWidth=6;
                ctx.beginPath();
                ctx.moveTo(-10,-4);
                ctx.lineTo(-24,16);
                ctx.moveTo(10,-4);
                ctx.lineTo(24,16);
                ctx.stroke();

                /* 腿 */
                ctx.beginPath();
                ctx.moveTo(-6,33);
                ctx.lineTo(-10,50);
                ctx.moveTo(6,33);
                ctx.lineTo(10,50);
                ctx.stroke();

                ctx.restore();

            }

        }

        else if(obj.id==="zero"){

            ctx.fillStyle="#161d27";
            ctx.fillRect(-45,-60,90,120);

            ctx.strokeStyle="#8c9cb0";
            ctx.strokeRect(-45,-60,90,120);

            ctx.fillStyle="#d7dfea";
            ctx.font="13px sans-serif";
            ctx.textAlign="center";
            ctx.fillText("ROOM",0,-5);
            ctx.fillText("ZERO",0,13);

        }

        else if(obj.id==="recorder"){

            ctx.fillStyle="#303b47";
            ctx.fillRect(-38,-24,76,48);

            ctx.fillStyle="#111820";

            ctx.beginPath();
            ctx.arc(-12,0,9,0,Math.PI*2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(12,0,9,0,Math.PI*2);
            ctx.fill();

        }

        else if(obj.id==="cabinet"){

            ctx.fillStyle="#3b3431";
            ctx.fillRect(-35,-45,70,90);

            ctx.strokeStyle="#786d64";
            ctx.strokeRect(-35,-45,70,90);

            ctx.beginPath();
            ctx.moveTo(-35,0);
            ctx.lineTo(35,0);
            ctx.stroke();

        }

        else if(obj.id==="chair"){

            ctx.fillStyle="#4a5360";
            ctx.fillRect(-23,-30,46,45);
            ctx.fillRect(-23,15,8,25);
            ctx.fillRect(15,15,8,25);

        }

        else if(obj.id==="hiddenDoor"){

            ctx.fillStyle="#171d26";
            ctx.fillRect(-42,-60,84,120);

            ctx.strokeStyle="#66758a";
            ctx.strokeRect(-42,-60,84,120);

            ctx.fillStyle="#8a98a9";
            ctx.font="11px sans-serif";
            ctx.textAlign="center";
            ctx.fillText("↓",0,5);

        }

        else if(obj.id==="archiveTerminal"){

            ctx.fillStyle="#1b2632";
            ctx.fillRect(-35,-40,70,80);

            ctx.fillStyle="#7d9bb8";
            ctx.fillRect(-27,-28,54,34);

            ctx.fillStyle="#151b22";
            ctx.fillRect(-15,15,30,10);

        }

        else if(obj.id==="archiveFiles"){

            ctx.fillStyle="#6a5a47";
            ctx.fillRect(-38,-40,76,80);

            ctx.strokeStyle="#9a866d";
            ctx.strokeRect(-38,-40,76,80);

        }

        else if(obj.id==="powerPanel"){

            ctx.fillStyle="#252f3b";
            ctx.fillRect(-35,-45,70,90);

            ctx.strokeStyle="#74869b";
            ctx.strokeRect(-35,-45,70,90);

            ctx.fillStyle=
                game.archivePower
                ? "#9fd19b"
                : "#b36b6b";

            ctx.beginPath();
            ctx.arc(0,-15,7,0,Math.PI*2);
            ctx.fill();

        }

        else if(obj.id==="archiveDoor"){

            ctx.fillStyle="#1b222c";
            ctx.fillRect(-45,-60,90,120);

            ctx.strokeStyle="#7b8a9e";
            ctx.strokeRect(-45,-60,90,120);

            ctx.fillStyle="#8998aa";
            ctx.font="11px sans-serif";
            ctx.textAlign="center";
            ctx.fillText("ARCHIVE",0,5);

        }

        else if(obj.id==="monitor"){

            ctx.fillStyle="#151d26";
            ctx.fillRect(-45,-32,90,64);

            ctx.fillStyle=
                game.archivePuzzleSolved
                ? "#54718b"
                : "#0d131a";

            ctx.fillRect(-36,-23,72,46);

            ctx.fillStyle="#11171e";
            ctx.fillRect(-8,32,16,14);

        }

        else if(obj.id==="returnDoor"){

            ctx.fillStyle="#1c242e";
            ctx.fillRect(-45,-60,90,120);

            ctx.strokeStyle="#8b99a9";
            ctx.strokeRect(-45,-60,90,120);

            ctx.fillStyle="#c1cad5";
            ctx.font="11px sans-serif";
            ctx.textAlign="center";
            ctx.fillText("RETURN",0,4);

        }

        ctx.restore();

    }

}


/* ============================================================
   玩家
============================================================ */

function drawPlayer(){

    ctx.save();

    ctx.translate(player.x,player.y);

    const angle=
        Math.atan2(
            player.lastDirY,
            player.lastDirX
        );

    ctx.rotate(angle);

    /* 身體 */

    ctx.fillStyle="#c7d0dc";

    ctx.beginPath();
    ctx.arc(0,0,15,0,Math.PI*2);
    ctx.fill();

    /* 外套 */

    ctx.fillStyle="#202a35";

    ctx.beginPath();
    ctx.arc(0,5,11,0,Math.PI*2);
    ctx.fill();

    /* 手電筒方向 */

    ctx.fillStyle="#e7eef7";

    ctx.fillRect(10,-4,13,8);

    ctx.restore();

}


/* ============================================================
   光源
============================================================ */

function drawLighting(){

    if(!game.started) return;

    const darkness=
        ctx.createRadialGradient(
            player.x,
            player.y,
            40,
            player.x,
            player.y,
            Math.max(W,H)*.75
        );

    darkness.addColorStop(
        0,
        "rgba(0,0,0,.04)"
    );

    darkness.addColorStop(
        .45,
        "rgba(0,0,0,.50)"
    );

    darkness.addColorStop(
        1,
        "rgba(0,0,0,.88)"
    );

    ctx.fillStyle=darkness;
    ctx.fillRect(0,0,W,H);

    if(!game.flashlight) return;

    const light=
        ctx.createRadialGradient(
            player.x,
            player.y,
            10,
            player.x,
            player.y,
            250
        );

    light.addColorStop(
        0,
        "rgba(220,235,255,.18)"
    );

    light.addColorStop(
        .35,
        "rgba(180,210,240,.08)"
    );

    light.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=light;

    ctx.fillRect(
        player.x-260,
        player.y-260,
        520,
        520
    );

    /* 前方光束 */

    const beamLength=360;
    const beamWidth=Math.PI/7;

    const angle=
        Math.atan2(
            player.lastDirY,
            player.lastDirX
        );

    ctx.save();

    ctx.translate(player.x,player.y);
    ctx.rotate(angle);

    const beam=
        ctx.createRadialGradient(
            30,
            0,
            5,
            beamLength*.65,
            0,
            beamLength
        );

    beam.addColorStop(
        0,
        "rgba(220,235,255,.11)"
    );

    beam.addColorStop(
        1,
        "rgba(220,235,255,0)"
    );

    ctx.fillStyle=beam;

    ctx.beginPath();

    ctx.moveTo(20,-10);

    ctx.arc(
        20,
        0,
        beamLength,
        -beamWidth,
        beamWidth
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}
