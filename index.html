<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不要相信遊戲</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#070711;
    --panel:rgba(20,17,38,.82);
    --purple:#9b5cff;
    --blue:#4cc9ff;
    --pink:#ff4fd8;
    --text:#f4efff;
    --muted:#9791ae;
    --danger:#ff4d6d;
    --green:#55f2b0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 10%,rgba(112,53,255,.18),transparent 30%),
        radial-gradient(circle at 80% 90%,rgba(0,174,255,.12),transparent 30%),
        #070711;
    color:var(--text);
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:35px 35px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

#app{
    width:100%;
    max-width:1000px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
}

.screen{
    display:none;
    flex:1;
}

.screen.active{
    display:flex;
    flex-direction:column;
}

.start{
    justify-content:center;
    align-items:center;
    text-align:center;
}

.logo{
    font-size:clamp(42px,10vw,82px);
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:10px;
    background:linear-gradient(120deg,#fff,#a86cff,#48cfff);
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(155,92,255,.35);
}

.subtitle{
    color:var(--muted);
    font-size:15px;
    letter-spacing:4px;
    margin-bottom:45px;
}

.start-card{
    width:min(600px,100%);
    padding:30px;
    border:1px solid rgba(155,92,255,.25);
    background:rgba(18,15,32,.8);
    border-radius:24px;
    box-shadow:
        0 0 50px rgba(96,50,180,.12),
        inset 0 1px rgba(255,255,255,.05);
}

.start-card p{
    line-height:1.9;
    color:#c2bdd0;
    margin-bottom:25px;
}

.main-btn{
    width:100%;
    border:none;
    border-radius:15px;
    padding:16px 20px;
    font-size:17px;
    font-weight:800;
    color:white;
    background:linear-gradient(135deg,#713bdf,#3b83ff);
    box-shadow:0 8px 25px rgba(92,63,255,.25);
    cursor:pointer;
    transition:.2s;
}

.main-btn:active{
    transform:scale(.97);
}

.small-note{
    margin-top:16px;
    font-size:12px;
    color:#6e6882;
}

/* HUD */

.hud{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.hud-box{
    background:rgba(20,17,38,.75);
    border:1px solid rgba(155,92,255,.18);
    border-radius:14px;
    padding:10px;
    text-align:center;
}

.hud-label{
    font-size:10px;
    color:#77718c;
    letter-spacing:2px;
}

.hud-value{
    margin-top:3px;
    font-size:17px;
    font-weight:800;
}

.progress{
    height:4px;
    background:#171426;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress-bar{
    height:100%;
    width:0;
    background:linear-gradient(90deg,var(--purple),var(--blue));
    transition:.4s;
}

/* game */

.game-card{
    flex:1;
    min-height:580px;
    position:relative;
    overflow:hidden;
    padding:25px;
    border-radius:25px;
    background:
        linear-gradient(145deg,rgba(24,20,45,.9),rgba(10,10,20,.95));
    border:1px solid rgba(155,92,255,.22);
    box-shadow:
        0 0 60px rgba(77,40,160,.12),
        inset 0 1px rgba(255,255,255,.04);
}

.level-title{
    font-size:13px;
    color:#8e87a6;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.question{
    font-size:clamp(22px,5vw,34px);
    font-weight:800;
    line-height:1.45;
    margin-bottom:10px;
}

.description{
    color:#9992ad;
    line-height:1.7;
    font-size:14px;
    margin-bottom:25px;
}

.game-area{
    min-height:350px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.choice-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.choice{
    min-height:90px;
    padding:20px;
    border-radius:17px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    transition:.18s;
}

.choice:active{
    transform:scale(.96);
}

.choice:hover{
    border-color:rgba(155,92,255,.55);
    background:rgba(155,92,255,.08);
}

.hint-btn{
    position:absolute;
    right:20px;
    top:20px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(155,92,255,.35);
    background:rgba(30,25,52,.9);
    color:#c7b6ff;
    font-weight:900;
    cursor:pointer;
}

.hint-box{
    margin-top:15px;
    padding:12px 15px;
    border-radius:12px;
    background:rgba(155,92,255,.08);
    border:1px solid rgba(155,92,255,.2);
    color:#bdb4d4;
    font-size:13px;
    line-height:1.6;
    display:none;
}

.hint-box.show{
    display:block;
}

/* memory */

.memory-grid{
    display:grid;
    grid-template-columns:repeat(4,65px);
    gap:10px;
}

.memory-cell{
    width:65px;
    height:65px;
    border-radius:13px;
    background:#171426;
    border:1px solid #30294a;
    cursor:pointer;
}

.memory-cell.active{
    background:linear-gradient(135deg,#a55cff,#4fcfff);
    box-shadow:0 0 20px rgba(120,90,255,.5);
}

.memory-cell.selected{
    background:#312b49;
    border-color:#8e75ff;
}

/* numbers */

.number{
    font-size:clamp(38px,10vw,65px);
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:25px;
}

/* sequence */

.sequence{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-bottom:30px;
}

.seq-item{
    width:65px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#171426;
    border:1px solid #332b4d;
    font-size:20px;
    font-weight:800;
}

/* shapes */

.shape-grid{
    display:grid;
    grid-template-columns:repeat(3,90px);
    gap:15px;
}

.shape{
    width:90px;
    height:90px;
    border-radius:16px;
    background:#151223;
    border:1px solid #302846;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    cursor:pointer;
}

/* timing */

.timing-wrap{
    width:min(600px,100%);
}

.timing-line{
    position:relative;
    height:45px;
    background:#171426;
    border-radius:30px;
    overflow:hidden;
    border:1px solid #302847;
}

.target-zone{
    position:absolute;
    left:42%;
    width:16%;
    top:0;
    bottom:0;
    background:rgba(85,242,176,.25);
    border-left:1px solid #55f2b0;
    border-right:1px solid #55f2b0;
}

.moving-point{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    top:16px;
    left:0;
    background:white;
    box-shadow:0 0 15px white;
}

/* code */

.code-display{
    font-size:48px;
    letter-spacing:12px;
    margin-bottom:20px;
    font-weight:900;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,70px);
    gap:10px;
}

.key{
    height:55px;
    border-radius:12px;
    border:1px solid #302846;
    background:#161326;
    color:white;
    font-size:18px;
    font-weight:800;
}

/* feedback */

.feedback{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,120px);
    width:min(430px,calc(100% - 30px));
    padding:15px 20px;
    border-radius:15px;
    text-align:center;
    background:#171426;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    transition:.3s;
    z-index:50;
}

.feedback.show{
    transform:translate(-50%,0);
}

.feedback.good{
    border-color:rgba(85,242,176,.5);
}

.feedback.bad{
    border-color:rgba(255,77,109,.5);
}

/* result */

.result{
    justify-content:center;
    align-items:center;
    text-align:center;
}

.result-icon{
    font-size:70px;
    margin-bottom:15px;
}

.result h1{
    font-size:38px;
    margin-bottom:10px;
}

.result p{
    color:#9b95ac;
    line-height:1.8;
    margin-bottom:25px;
}

.result-box{
    width:min(500px,100%);
    background:rgba(20,17,38,.8);
    border:1px solid rgba(155,92,255,.2);
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
}

.final-score{
    font-size:45px;
    font-weight:900;
    color:#b687ff;
}

/* final */

.final-clues{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

.clue{
    padding:10px 15px;
    border-radius:10px;
    background:#171426;
    border:1px solid #31294a;
    color:#cfc7e0;
    font-weight:700;
}

@media(max-width:600px){

    #app{
        padding:10px;
    }

    .game-card{
        padding:20px 15px;
        min-height:620px;
    }

    .hud{
        gap:6px;
    }

    .hud-box{
        padding:8px 4px;
    }

    .hud-value{
        font-size:14px;
    }

    .choice-grid{
        grid-template-columns:1fr;
    }

    .choice{
        min-height:70px;
    }

    .memory-grid{
        grid-template-columns:repeat(4,58px);
        gap:7px;
    }

    .memory-cell{
        width:58px;
        height:58px;
    }

    .shape-grid{
        grid-template-columns:repeat(3,72px);
        gap:8px;
    }

    .shape{
        width:72px;
        height:72px;
    }

    .keypad{
        grid-template-columns:repeat(3,65px);
    }

    .key{
        height:52px;
    }

    .logo{
        letter-spacing:3px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- 開始畫面 -->
    <section id="startScreen" class="screen active start">

        <div class="logo">不要相信遊戲</div>

        <div class="subtitle">
            THE GAME IS LYING
        </div>

        <div class="start-card">

            <p>
                這不是單純的反應遊戲。<br>
                遊戲會說謊，但不代表它沒有規則。
                <br><br>
                有些東西是假的，有些東西是真的。
                <br>
                你需要做的不是盲目相信提示，
                而是找出「真正的規則」。
            </p>

            <button class="main-btn" onclick="startGame()">
                開始遊戲
            </button>

            <div class="small-note">
                20 個關卡 · 支援手機 · 建議戴耳機遊玩
            </div>

        </div>

    </section>


    <!-- 遊戲畫面 -->
    <section id="gameScreen" class="screen">

        <div class="hud">

            <div class="hud-box">
                <div class="hud-label">LEVEL</div>
                <div class="hud-value" id="levelText">1 / 20</div>
            </div>

            <div class="hud-box">
                <div class="hud-label">SCORE</div>
                <div class="hud-value" id="scoreText">0</div>
            </div>

            <div class="hud-box">
                <div class="hud-label">LIVES</div>
                <div class="hud-value" id="livesText">♥ ♥ ♥</div>
            </div>

            <div class="hud-box">
                <div class="hud-label">CLUES</div>
                <div class="hud-value" id="clueText">0</div>
            </div>

        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="game-card">

            <button class="hint-btn" onclick="showHint()">?</button>

            <div class="level-title" id="levelTitle">
                LEVEL 01
            </div>

            <div class="question" id="question"></div>

            <div class="description" id="description"></div>

            <div class="game-area" id="gameArea"></div>

            <div class="hint-box" id="hintBox"></div>

        </div>

    </section>


    <!-- 結束 -->
    <section id="resultScreen" class="screen result">

        <div class="result-icon" id="resultIcon">◈</div>

        <h1 id="resultTitle">
            遊戲結束
        </h1>

        <div class="result-box">

            <div class="hud-label">
                FINAL SCORE
            </div>

            <div class="final-score" id="finalScore">
                0
            </div>

            <p id="resultText"></p>

        </div>

        <button class="main-btn" id="restartBtn">
            再玩一次
        </button>

    </section>

</div>

<div class="feedback" id="feedback"></div>


<script>

/* =========================
   遊戲基本資料
========================= */

let currentLevel = 0;
let score = 0;
let lives = 3;
let hintsUsed = 0;
let clues = [];

let levelTimer = null;
let timingAnimation = null;

const totalLevels = 20;


/* =========================
   DOM
========================= */

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const resultScreen = document.getElementById("resultScreen");

const question = document.getElementById("question");
const description = document.getElementById("description");
const gameArea = document.getElementById("gameArea");

const levelText = document.getElementById("levelText");
const scoreText = document.getElementById("scoreText");
const livesText = document.getElementById("livesText");
const clueText = document.getElementById("clueText");
const progressBar = document.getElementById("progressBar");

const hintBox = document.getElementById("hintBox");
const feedback = document.getElementById("feedback");

const resultIcon = document.getElementById("resultIcon");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");
const finalScore = document.getElementById("finalScore");

const restartBtn = document.getElementById("restartBtn");


/* =========================
   開始 / 重玩
========================= */

function startGame(){

    clearTimers();

    currentLevel = 0;
    score = 0;
    lives = 3;
    hintsUsed = 0;
    clues = [];

    startScreen.classList.remove("active");
    resultScreen.classList.remove("active");
    gameScreen.classList.add("active");

    updateHUD();
    loadLevel();
}

restartBtn.addEventListener("click", startGame);


/* =========================
   HUD
========================= */

function updateHUD(){

    levelText.textContent =
        `${currentLevel + 1} / ${totalLevels}`;

    scoreText.textContent = score;

    livesText.textContent =
        "♥ ".repeat(lives).trim() +
        (lives < 3 ? " ♡".repeat(3-lives) : "");

    clueText.textContent = clues.length;

    progressBar.style.width =
        `${(currentLevel / totalLevels) * 100}%`;
}


/* =========================
   關卡載入
========================= */

function loadLevel(){

    clearTimers();

    hintBox.classList.remove("show");
    hintBox.textContent = "";

    gameArea.innerHTML = "";

    updateHUD();

    const level = levels[currentLevel];

    document.getElementById("levelTitle").textContent =
        `LEVEL ${String(currentLevel + 1).padStart(2,"0")}`;

    question.textContent = level.question;
    description.textContent = level.description;

    level.setup();
}


/* =========================
   正確 / 錯誤
========================= */

function correct(points = 100, clue = null){

    score += points;

    if(clue && !clues.includes(clue)){
        clues.push(clue);
    }

    updateHUD();

    showFeedback(
        "✓ 正確。你找到真正的規則了。",
        true
    );

    setTimeout(nextLevel, 650);
}


function wrong(){

    lives--;

    updateHUD();

    if(lives <= 0){

        setTimeout(gameOver, 500);
        return;
    }

    showFeedback(
        "✕ 不對。再觀察一次。",
        false
    );
}


/* =========================
   下一關
========================= */

function nextLevel(){

    currentLevel++;

    if(currentLevel >= totalLevels){
        winGame();
        return;
    }

    loadLevel();
}


/* =========================
   提示
========================= */

function showHint(){

    const level = levels[currentLevel];

    if(!level.hint){
        return;
    }

    hintsUsed++;

    hintBox.textContent =
        "提示：" + level.hint;

    hintBox.classList.add("show");

    score = Math.max(0, score - 15);

    updateHUD();
}


/* =========================
   回饋
========================= */

function showFeedback(text, good){

    feedback.textContent = text;

    feedback.className =
        "feedback show " + (good ? "good" : "bad");

    setTimeout(()=>{
        feedback.classList.remove("show");
    },900);
}


/* =========================
   清除計時
========================= */

function clearTimers(){

    if(levelTimer){
        clearTimeout(levelTimer);
        levelTimer = null;
    }

    if(timingAnimation){
        cancelAnimationFrame(timingAnimation);
        timingAnimation = null;
    }
}


/* =========================
   遊戲結束
========================= */

function gameOver(){

    clearTimers();

    gameScreen.classList.remove("active");
    resultScreen.classList.add("active");

    resultIcon.textContent = "×";
    resultTitle.textContent = "你被遊戲騙了";

    finalScore.textContent = score;

    resultText.textContent =
        `你走到了第 ${currentLevel + 1} 關。` +
        " 有些錯誤並不是因為反應慢，而是因為太相信眼前的東西。";
}


/* =========================
   遊戲完成
========================= */

function winGame(){

    clearTimers();

    gameScreen.classList.remove("active");
    resultScreen.classList.add("active");

    resultIcon.textContent = "◆";
    resultTitle.textContent = "你沒有相信它";

    finalScore.textContent = score;

    resultText.textContent =
        "20 個關卡全部完成。你沒有單純相信遊戲給你的答案，而是找出了它真正留下的線索。";
}


/* =========================
   工具：建立按鈕
========================= */

function makeButton(text, callback){

    const button = document.createElement("button");

    button.className = "choice";
    button.textContent = text;

    button.addEventListener("click", callback);

    return button;
}


/* =========================
   20 個關卡
========================= */

const levels = [

/* 1 */
{
    question:"哪一個按鈕是真的？",
    description:"兩個按鈕看起來完全一樣，但只有一個會讓你進入下一關。",
    hint:"不要看按鈕的顏色。注意文字本身。",
    setup(){

        const grid = document.createElement("div");
        grid.className="choice-grid";

        const a = makeButton("繼續",()=>{
            correct(100,"真正的答案不一定最醒目");
        });

        const b = makeButton("繼續",()=>{
            wrong();
        });

        grid.append(a,b);
        gameArea.appendChild(grid);
    }
},

/* 2 */
{
    question:"找出唯一不同的符號。",
    description:"四個符號中只有一個與其他三個不同。",
    hint:"不要只看外形，仔細比較符號的方向。",
    setup(){

        const grid=document.createElement("div");
        grid.className="choice-grid";

        ["◈","◈","◇","◈"].forEach((x,i)=>{

            const b=makeButton(x,()=>{
                if(i===2){
                    correct(120,"答案藏在細節");
                }else{
                    wrong();
                }
            });

            grid.appendChild(b);
        });

        gameArea.appendChild(grid);
    }
},

/* 3 */
{
    question:"下一個數字是多少？",
    description:"找出數列中的規律。",
    hint:"每一次增加的數字都一樣。",
    setup(){

        const wrap=document.createElement("div");

        const seq=document.createElement("div");
        seq.className="sequence";

        [3,6,9,12,"?"].forEach(x=>{

            const d=document.createElement("div");
            d.className="seq-item";
            d.textContent=x;

            seq.appendChild(d);
        });

        const grid=document.createElement("div");
        grid.className="choice-grid";

        [14,15,16,18].forEach(x=>{

            const b=makeButton(x,()=>{
                if(x===15){
                    correct(120,"先找規律，再相信答案");
                }else{
                    wrong();
                }
            });

            grid.appendChild(b);
        });

        wrap.append(seq,grid);
        gameArea.appendChild(wrap);
    }
},

/* 4 */
{
    question:"記住亮起的位置。",
    description:"亮起的格子會消失。請選出剛才亮過的三格。",
    hint:"不用記全部，只需要記住亮起的位置。",
    setup(){

        const grid=document.createElement("div");
        grid.className="memory-grid";

        const answer=[1,6,11];

        for(let i=0;i<16;i++){

            const cell=document.createElement("div");
            cell.className="memory-cell";

            cell.addEventListener("click",()=>{

                if(cell.classList.contains("selected")){
                    cell.classList.remove("selected");
                    return;
                }

                cell.classList.add("selected");

                const selected=
                    [...grid.children]
                    .map((x,index)=>x.classList.contains("selected")?index:-1)
                    .filter(x=>x>=0);

                if(selected.length===3){

                    if(
                        selected.every(x=>answer.includes(x)) &&
                        answer.every(x=>selected.includes(x))
                    ){
                        correct(150,"記憶中的東西比眼前的更重要");
                    }else{
                        wrong();
                    }
                }
            });

            grid.appendChild(cell);
        }

        gameArea.appendChild(grid);

        setTimeout(()=>{

            answer.forEach(i=>{
                grid.children[i].classList.add("active");
            });

            setTimeout(()=>{

                answer.forEach(i=>{
                    grid.children[i].classList.remove("active");
                });

            },1200);

        },300);
    }
},

                x=100-x;

            point.style.left=`calc(${x}% - 6px)`;

            timingAnimation=requestAnimationFrame(animate);
